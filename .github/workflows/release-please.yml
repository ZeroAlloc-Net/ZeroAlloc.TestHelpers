name: Release Please

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  packages: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      # Pushes and PRs made with GITHUB_TOKEN trigger no workflows, so bot PRs
      # never got their required checks. A token from the release bot GitHub App
      # acts as the App, and its pushes trigger CI like anyone else's.
      - name: Mint a release bot token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.RELEASE_BOT_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write

      - uses: googleapis/release-please-action@v5
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          token: ${{ steps.app-token.outputs.token }}

  # Builds the release tag, packs every packable project, checks the versions inside the
  # packages, pushes them, and waits until nuget.org serves every one of them. Shared from
  # ZeroAlloc-Net/.github so a fix there reaches every repository; see ZeroAlloc-Net/.github#49.
  publish:
    needs: release-please
    if: needs.release-please.outputs.releases_created == 'true'
    uses: ZeroAlloc-Net/.github/.github/workflows/publish.yml@main
    with:
      tag: ${{ needs.release-please.outputs.tag_name }}
      version: ${{ needs.release-please.outputs.version }}
      solution: ZeroAlloc.TestHelpers.slnx
      # This repository publishes to GitHub Packages
      # and does not attach its packages to the GitHub release.
      github-packages: true
      release-assets: false
      # nuget.org checks a trusted publisher against the workflow that runs the job, so the push is the
      # push job below, not this reusable workflow.
      push: false

  push:
    needs: [release-please, publish]
    if: needs.release-please.outputs.releases_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write
    steps:
      # Runs as steps of this job, so nuget.org sees this workflow file in the OIDC claim, which is
      # what the trusted publisher policy names. The policy is created by the account in NUGET_USER.
      - uses: ZeroAlloc-Net/.github/.github/actions/nuget-push@main
        with:
          tag: ${{ needs.release-please.outputs.tag_name }}
          version: ${{ needs.release-please.outputs.version }}
          nuget-user: ${{ vars.NUGET_USER }}
          nuget-api-key: ${{ secrets.NUGET_API_KEY }}
          github-packages: true
          release-assets: false

  # Builds the release tag and attaches a CycloneDX SBOM of the solution to its GitHub
  # release. release-please created that release in the release-please job, and this
  # workflow runs on main, so the tag comes from that job's tag_name output. It waits
  # for publish, so an SBOM is only attached to a release that was published.
  sbom:
    needs: [release-please, publish, push]
    if: needs.release-please.outputs.releases_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          dotnet-version: 10.0.x

      - name: Build the release
        env:
          VERSION: ${{ needs.release-please.outputs.version }}
        run: dotnet build ZeroAlloc.TestHelpers.slnx --configuration Release -p:Version="$VERSION"

      - name: Attach the SBOM to the GitHub release
        uses: MarcelRoozekrans/ci-baseline/actions/sbom@v1
        with:
          solution: ZeroAlloc.TestHelpers.slnx
          tag: ${{ needs.release-please.outputs.tag_name }}
