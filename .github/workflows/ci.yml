name: CI

on:
  push:
    branches: [main, 'release-please--**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-commits:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Lint commit messages
        uses: wagoid/commitlint-github-action@v6
        with:
          configFile: .commitlintrc.yml

  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # Codecov upload via OIDC, no token secret
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          # Installs the SDK global.json pins. Without it the job never installs
          # that SDK at all and only works when the runner image happens to ship one
          # satisfying the pin, which is how a publish failed on a lagging image.
          global-json-file: global.json
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore
      - name: Build
        # CI packages carry an explicit CI version; there is no GitVersion here. It goes to the
        # build, not only to pack: pack runs --no-build, and the version guard checks the
        # assembly this step built. Without it the CI package claimed the fallback 1.0.0 from
        # Directory.Build.props. See ZeroAlloc-Net/.github#36.
        run: dotnet build --configuration Release --no-restore -p:Version=0.0.0-ci.${{ github.run_number }}
      - name: Test
        run: dotnet test --configuration Release --no-build --verbosity normal --settings coverage.runsettings --results-directory TestResults
      # Merges the Cobertura reports and fails below the line coverage floor, or when codecov.yml would let a
      # drop in coverage pass quietly.
      - name: Coverage gate
        uses: MarcelRoozekrans/ci-baseline/actions/coverage-gate@v1
        with:
          reports: TestResults/**/coverage.cobertura.xml
          floor: 79
          floor-override-reason: "Coverage is 79.2 percent today. Raise it: https://github.com/ZeroAlloc-Net/ZeroAlloc.TestHelpers/issues/108"
      - name: Upload coverage to Codecov
        if: '!cancelled()'
        uses: codecov/codecov-action@v7
        with:
          use_oidc: true
          files: "TestResults/**/coverage.cobertura.xml"
          disable_search: true   # only the files above, not every *.xml the search finds
          fail_ci_if_error: false
      - name: Pack (verify)
        run: dotnet pack src/ZeroAlloc.TestHelpers/ZeroAlloc.TestHelpers.csproj --configuration Release --no-build --output ./artifacts -p:Version=0.0.0-ci.${{ github.run_number }}
      - name: Package probes
        # Builds consumer projects against the packed nupkg rather than the linked sources, which
        # is the only way the contentFiles and build/*.targets are exercised. Includes a Native
        # AOT publish of the probe that has no Roslyn reference.
        run: bash tests/PackageProbes/run.sh --aot
      - name: Upload NuGet artifact
        uses: actions/upload-artifact@v7
        with:
          name: nuget-package
          path: ./artifacts/*.nupkg

  api-compat:
    uses: ZeroAlloc-Net/.github/.github/workflows/api-compat.yml@main
